<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPRINT MULTI-SERVICES | Bienvenue</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --whatsapp-gradient: linear-gradient(135deg, #25d366, #128c7e);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-muted: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 198, 255, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(224, 28, 213, 0.2) 0px, transparent 50%);
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Container Principal */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 198, 255, 0.2);
            animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo Intégré */
        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #00c6ff, #e01cd5);
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.5);
            animation: pulseLogo 3s infinite alternate;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffff;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 198, 255, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(224, 28, 213, 0.7); }
        }

        /* Titre & Slogan */
        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #00c6ff, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .welcome-tag {
            font-size: 12px;
            color: #00c6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-top: 4px;
            margin-bottom: 5px;
        }

        .slogan {
            font-size: 11px;
            color: #e01cd5;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .description {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* Grille des Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 8px;
            border-radius: 16px;
            font-size: 11px;
            color: #f3f4f6;
            transition: all 0.3s ease;
        }

        .service-item i {
            font-size: 20px;
            color: #00c6ff;
            display: block;
            margin-bottom: 6px;
        }

        .service-item:hover {
            background: rgba(0, 198, 255, 0.15);
            border-color: rgba(0, 198, 255, 0.4);
            transform: translateY(-3px);
        }

        /* Boutons d'action */
        .actions-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-whatsapp {
            background: var(--whatsapp-gradient);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.35);
        }

        .btn-whatsapp:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.55);
        }

        .btn-whatsapp i {
            font-size: 22px;
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo de l'entreprise -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="IPRINT MULTI-SERVICES Logo" class="logo-img">
        </div>

        <!-- En-tête -->
        <div class="welcome-tag">Bienvenue chez</div>
        <h1 class="brand-name">IPRINT MULTI-SERVICES</h1>
        <div class="slogan">CONFIANCE MAINTENANT</div>
        
        <!-- Description -->
        <p class="description">
            Votre partenaire d'excellence pour l'impression numérique, la création graphique et les services digitaux.
        </p>

        <!-- Grille des Services -->
        <div class="services-grid">
            <div class="service-item">
                <i class="fa-solid fa-print"></i>
                Impression
            </div>
            <div class="service-item">
                <i class="fa-solid fa-palette"></i>
                Design
            </div>
            <div class="service-item">
                <i class="fa-solid fa-laptop-code"></i>
                Digital
            </div>
        </div>

        <!-- Bouton de contact WhatsApp -->
        <div class="actions-wrapper">
            <!-- Remplacez le numéro  par votre propre numéro WhatsApp -->
            <a href="https://wa.me/2250140071815" class="btn btn-whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>
                Contactez-nous sur WhatsApp
            </a>
        </div>

        <!-- Pied de page -->
        <div class="footer">
            &copy; IPRINT MULTI-SERVICES
        </div>
    </div>

</body>
</html>
