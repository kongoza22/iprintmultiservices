<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPRINT MULTI-SERVICES | Bienvenue</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --whatsapp-gradient: linear-gradient(135deg, #25d366, #128c7e);
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #060913;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* --- CANVA DE PARTICULES ANIMÉES --- */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- CONTAINER PRINCIPAL ANIMÉ --- */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(0, 198, 255, 0.25);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out, box-shadow 0.3s ease;
            animation: floatCard 6s ease-in-out infinite alternate, fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) rotateX(0deg); }
            100% { transform: translateY(-12px) rotateX(2deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- LOGO ROTATIF & LUMINEUX --- */
        .logo-wrapper {
            position: relative;
            width: 115px;
            height: 115px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 4px;
            transform-style: preserve-3d;
        }

        /* Anneau animé rotatif */
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            background: conic-gradient(#00c6ff, #e01cd5, #25d366, #00c6ff);
            animation: rotateRing 4s linear infinite;
            z-index: -1;
        }

        .logo-wrapper::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            background: conic-gradient(#00c6ff, #e01cd5, #25d366, #00c6ff);
            filter: blur(15px);
            opacity: 0.6;
            animation: rotateRing 4s linear infinite;
            z-index: -2;
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffff;
            transition: transform 0.4s ease;
        }

        .logo-wrapper:hover .logo-img {
            transform: scale(1.08) rotate(5deg);
        }

        /* --- TYPOGRAPHIE ET EFFETS DE TEXTE --- */
        .welcome-tag {
            font-size: 12px;
            color: #00c6ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 6px;
            animation: pulseText 2s ease-in-out infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.7; letter-spacing: 3px; }
            100% { opacity: 1; letter-spacing: 4px; }
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #00c6ff, #e01cd5, #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .slogan {
            font-size: 11px;
            color: #e01cd5;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(224, 28, 213, 0.5);
        }

        .description {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* --- SERVICES INTERACTIFS --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 8px;
            border-radius: 18px;
            font-size: 11px;
            color: #f3f4f6;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
        }

        .service-item i {
            font-size: 22px;
            color: #00c6ff;
            display: block;
            margin-bottom: 8px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .service-item:hover {
            background: rgba(0, 198, 255, 0.15);
            border-color: rgba(0, 198, 255, 0.5);
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 198, 255, 0.2);
        }

        .service-item:hover i {
            transform: scale(1.2) rotate(-10deg);
            color: #e01cd5;
        }

        /* --- BOUTON WHATSAPP AVEC ONDE PULSANTE --- */
        .actions-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-whatsapp {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            background: var(--whatsapp-gradient);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        /* Pulse glow du bouton */
        .btn-whatsapp::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.6);
        }

        .btn-whatsapp:hover::before {
            animation: ripple 1s ease-out infinite;
        }

        @keyframes ripple {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .btn-whatsapp i {
            font-size: 24px;
            animation: phoneVibrate 2s infinite;
        }

        @keyframes phoneVibrate {
            0%, 100% { transform: rotate(0deg); }
            10%, 30% { transform: rotate(-12deg); }
            20%, 40% { transform: rotate(12deg); }
            50% { transform: rotate(0deg); }
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Arrière-plan dynamique Canvas -->

            </a>

    <script>
        // --- 1. SCRIPT DES PARTICULES FROTTANTES (CANVAS) ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 45;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.color = Math.random() > 0.5 ? 'rgba(0, 198, 255, ' : 'rgba(224, 28, 213, ';
                this.alpha = Math.random() * 0.6 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color + this.alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
